# cargo-deny configuration (advisories, licenses, duplicate versions).
# Run by `cargo xtask ci` and the CI lint job where cargo-deny is available.

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# No wolf-lang crate may ever appear in this graph: the editor layer talks to a
# `wolf` process over stdio, never links against it (D34, ls00 non-targets).
deny = [
    { name = "wolf_span" },
    { name = "wolf_diag" },
    { name = "wolf_driver" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
