# Known divergences between `wolf build` and `wolf lsp` — the ledger.
#
# ls01 §9: a one-truth mismatch is a **wolf-lang bug, filed upstream with both
# records attached — never normalized away, never patched around here**. The
# editor layer detects divergence; it does not hide it.
#
# That rule needs somewhere for a *filed* divergence to live, or the only way to
# keep CI green is to stop checking. This file is that place, and it is
# deliberately uncomfortable to use:
#
#   * an entry must name the upstream filing. `filed = "pending"` is allowed for
#     exactly as long as it takes to open the issue, and it is the first thing a
#     reviewer should ask about.
#   * an entry that no longer matches a live divergence FAILS the check. A
#     ledger that outlives its bug is how a fixed bug gets re-introduced
#     unnoticed.
#   * a divergence with no entry FAILS the check. That is the default, and the
#     reason this file is short.
#
# `lspconf onetruth` reports known divergences as KNOWN, loudly, and exits 0;
# anything else exits 1.
